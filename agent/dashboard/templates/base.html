<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>ATLAS · IMS Agent Console</title>

<!-- ──────────────────────────────────────────────────────────────────────
     Phase 15 — Full dashboard rebuild from zip.
     React 18 + Babel Standalone, both vendored locally at /static/vendor/.
     No external CDN dependencies.  IBM Plex fonts also vendored.
     Soft rollback: set IMS_LEGACY_DASHBOARD=1 → serves index.html
     (the original Phase 12 monolithic layout).
     ────────────────────────────────────────────────────────────────────── -->

<link rel="stylesheet" href="/static/vendor/ibm-plex.css" />
<link rel="stylesheet" href="/static/atlas/styles.css" />

<script>
  // Set theme early to avoid FOUC flash
  try {
    var t = localStorage.getItem("atlas.theme");
    document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
  } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
</script>

<script>
  // Server-injected state — initial snapshot so React has data on first render
  // without a separate fetch round-trip.  Keys mirror /api/state.
  window.__IMS = {
    api_key:    "{{ api_key | default('') }}",
    cycle_id:   "{{ state.get('cycle_id', '') }}",
    health:     "{{ state.get('schedule_health', 'UNKNOWN') }}",
    milestones: {{ state.get('milestones', []) | tojson }},
    history:    {{ history | tojson }},
  };
</script>
</head>
<body>
<div id="root"></div>

<!-- React + Babel — all vendored locally, no CDN -->
<script src="/static/vendor/react.production.min.js"></script>
<script src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/vendor/babel.min.js"></script>

<!-- ATLAS console source — JSX, transformed in-browser by Babel.
     Files run in this order so each can reference globals exported by
     earlier files via Object.assign(window, {...}). -->
<script type="text/babel" src="/static/atlas/data.js"></script>
<!-- Phase 15.4 — hydrate window globals from real /api/* endpoints.
     Loaded as text/babel so it queues in source order AFTER data.js (Babel
     runs queued scripts sequentially after compilation).  app.jsx awaits
     window.__IMS_HYDRATE before mounting React. -->
<script type="text/babel" src="/static/atlas/api.js"></script>
<script type="text/babel" src="/static/atlas/components.jsx"></script>
<script type="text/babel" src="/static/atlas/charts.jsx"></script>
<script type="text/babel" src="/static/atlas/IMSStats.jsx"></script>
<script type="text/babel" src="/static/atlas/PMPortal.jsx"></script>
<script type="text/babel" src="/static/atlas/AgentControls.jsx"></script>
<script type="text/babel" src="/static/atlas/app.jsx"></script>
</body>
</html>
